
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: course
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U course -d course']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Порт публикуется только на loopback: он нужен утилите
    # `stripe listen`, которая перенаправляет вебхуки на localhost.
    # Наружу API по-прежнему доступен только через Nginx (443).
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      TRUST_PROXY: '1'
      GLOBAL_API_PREFIX: api
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: course
      # Секрет обязателен — без него приложение не стартует (src/common/jwt.config.ts).
      # Значение берётся из .env (docker compose читает его автоматически).
      # Сгенерировать командой: openssl rand -hex 32
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET обязателен - добавьте его в .env (openssl rand -hex 32)}"
      CORS_ORIGINS: https://localhost,https://127.0.0.1,http://localhost,http://127.0.0.1:5173,http://localhost:5173
      DB_AUTO_SYNC: "${DB_AUTO_SYNC:-0}"
      # Разрешить домены туннеля (*.trycloudflare.com) в CORS.
      # Нужно только для внешнего тестирования: включить через .env —
      # CORS_ALLOW_TUNNEL=1. По умолчанию выключено.
      CORS_ALLOW_TUNNEL: "${CORS_ALLOW_TUNNEL:-0}"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAIL_DEBUG: ${MAIL_DEBUG:-false}
      HEALTH_URL: http://127.0.0.1:3000/api/health/ready
      # Каталог фотографий продуктов. Монтируется томом ниже,
      # иначе загруженные фото исчезали бы при пересборке контейнера.
      UPLOAD_DIR: /app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'
    # Проверка готовности: эндпоинт обращается к базе, поэтому Docker
    # считает контейнер здоровым только когда БД реально отвечает.
    # Раньше healthcheck отсутствовал, и контейнер помечался запущенным
    # сразу после старта процесса.
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(String(process.env.HEALTH_URL)).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Тот же том, что у nginx ниже. Без него `/app/uploads` — обычная
    # папка внутри контейнера: при пересборке или пересоздании api
    # загруженные фото исчезали, а запись в БД продолжала ссылаться
    # на удалённый файл (отсюда 404 и заглушка вместо фото).
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - '80:80'
      - '443:443'
      # Порт только для туннеля. Публикуется ИСКЛЮЧИТЕЛЬНО на loopback:
      # наружу его выставляет cloudflared, а не Docker, поэтому прямой
      # доступ из локальной сети остаётся закрытым.
      - '127.0.0.1:8080:8080'
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      # Тот же том, что у api: Nginx отдаёт загруженные фото напрямую,
      # не проксируя каждый запрос через приложение.
      - uploads:/var/www/uploads:ro
    depends_on:
      api:
        condition: service_healthy
    # nginx отдаёт статику; проверяем, что он отвечает по HTTPS.
    # Флаг -k нужен из-за самоподписанного сертификата.
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-check-certificate -q -O /dev/null https://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  uploads:

  postgres_data:
