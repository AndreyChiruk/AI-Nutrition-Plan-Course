
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: course
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U course -d course']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      TRUST_PROXY: '1'
      GLOBAL_API_PREFIX: api
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: course
      JWT_SECRET: ${JWT_SECRET:-docker-dev-change-me}
      CORS_ORIGINS: https://localhost,https://127.0.0.1,http://localhost,http://127.0.0.1:5173,http://localhost:5173
      DB_AUTO_SYNC: '1'
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MAIL_DEBUG: ${MAIL_DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3000'

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  postgres_data:
