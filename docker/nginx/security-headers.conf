# Общие заголовки безопасности.
#
# Вынесены в отдельный файл, потому что в nginx директивы add_header
# НЕ наследуются: если внутри location объявлен хотя бы один add_header,
# заголовки уровня server теряются. Именно так и произошло с /index.html
# и /assets/ — они оставались без защитных заголовков.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=86400" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
