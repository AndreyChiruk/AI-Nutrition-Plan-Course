# Конфигурация для доступа из интернета через туннель.
#
# Зачем отдельный файл: основной `default.conf` на порту 80 делает
# `return 301 https://$host$request_uri`. Через туннель это ломается:
# туннель терминирует TLS на своей стороне и приходит к нам по HTTP,
# поэтому редирект уводит посетителя по кругу (или на несуществующий
# сертификат для нашего домена `localhost`).
#
# Здесь сервер слушает отдельный порт 8080 и отдаёт приложение по HTTP —
# без редиректа и без TLS. Наружу этот порт не публикуется: до него
# дотягивается только туннель, а вход в приложение защищает HTTPS
# на стороне Cloudflare.
#
# Дополнительно расширен CORS: приложение обращается к API по
# относительному пути `/api`, поэтому достаточно пропустить заголовки
# туннельного домена.

server {
    listen 8080;
    listen [::]:8080;

    # Домены туннеля заранее неизвестны (у Cloudflare это *.trycloudflare.com),
    # поэтому принимаем любой Host.
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html ссылается на хешированные ассеты: его кэширование
    # привело бы к тому, что после обновления пользователь остался бы
    # на старой версии приложения.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Лимит согласован с JSON_BODY_LIMIT в приложении (12 МБ).
    client_max_body_size 13m;

    include /etc/nginx/snippets/security-headers.conf;

    location /api {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Туннель приходит к нам по HTTP, но для посетителя соединение
        # защищено на стороне Cloudflare. Сообщаем приложению, что снаружи
        # был HTTPS: иначе NestJS может не выставить secure-cookie и
        # неверно строить абсолютные ссылки.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffer_size 128k;
        proxy_buffers 32 256k;
        proxy_busy_buffers_size 512k;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        send_timeout 1800s;
    }

    # Ассеты Vite содержат хеш в имени, поэтому их можно кэшировать надолго.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Загруженные фотографии продуктов — отдаются напрямую из тома.
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public";

        location ~* \.(php|phtml|js|html)$ {
            deny all;
        }

        try_files $uri =404;
    }

    location / {
        # Только $uri, без $uri/ и без absolute_redirect. Ветка $uri/
        # заставляла nginx строить абсолютный URL самостоятельно — он брал
        # внутренний порт 8080 и схему http, и посетитель получал
        # редирект на http://домен:8080/login/ вместо того же адреса.
        # Страницы приложения — SPA-маршруты без каталогов, поэтому
        # обработка каталогов здесь не нужна.
        try_files $uri /index.html;
    }

    # Отключаем абсолютные редиректы: за туннелем nginx не знает
    # внешнего домена и схемы, поэтому любой сгенерированный им
    # абсолютный адрес будет содержать внутренний порт.
    absolute_redirect off;
}
