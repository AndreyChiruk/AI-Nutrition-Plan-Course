# Сжатие ответов.
#
# Раньше gzip не был включён вовсе: основной JS-бандл (1.7 МБ) отдавался
# целиком. Сжатие уменьшает его до ~509 КБ (экономия ~71%), что заметно
# ускоряет первую загрузку, особенно на мобильных устройствах.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    application/rss+xml
    application/atom+xml
    image/svg+xml
    font/ttf
    font/otf;
gzip_disable "msie6";

upstream nest_api {
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost 127.0.0.1;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # index.html ссылается на хешированные ассеты: его кэширование
    # привело бы к тому, что после обновления пользователь остался бы
    # на старой версии приложения.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # Лимит согласован с JSON_BODY_LIMIT в приложении (12 МБ):
    # держим небольшой запас на заголовки, чтобы 413 отдавал nginx,
    # а не разрывалось соединение.
    client_max_body_size 13m;

    include /etc/nginx/snippets/security-headers.conf;

    location /api {
        proxy_pass http://nest_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffer_size 128k;
        proxy_buffers 32 256k;
        proxy_busy_buffers_size 512k;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        send_timeout 1800s;
    }


    # Ассеты Vite содержат хеш в имени, поэтому их можно кэшировать надолго.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Загруженные фотографии продуктов.
    #
    # Отдаются напрямую из тома: проксировать их через приложение
    # незачем, а Nginx делает это быстрее и умеет кэширование.
    # Том смонтирован только для чтения (/var/www/uploads).
    location /uploads/ {
        alias /var/www/uploads/;

        # Имена файлов содержат UUID, содержимое неизменно —
        # поэтому кэш можно держать долго.
        expires 30d;
        add_header Cache-Control "public";

        # Отключаем исполнение скриптов: в каталоге только изображения,
        # но подстраховка не лишняя.
        location ~* \.(php|phtml|js|html)$ {
            deny all;
        }

        # Если файла нет, возвращаем 404 — интерфейс покажет заглушку.
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
