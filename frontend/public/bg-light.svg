<?xml version="1.0" encoding="UTF-8"?>
<!--
  Фон светлой темы: мягкие органические формы (blob-фигуры).

  Назначение — подложка страницы под кремовым фоном #F5F1EA.
  Формы намеренно почти невидимые: контраст с фоном ниже 1.1:1,
  они дают глубину и «wellness-дыхание», но не мешают читать текст
  и не спорят с карточками интерфейса.

  Цвета:
    фон          #F5F1EA  (--sand)
    форма 1      #B4552D  (--terracotta), opacity 0.045
    форма 2      #5C6B3F  (--olive),      opacity 0.05
    форма 3      #8C3F1F  (--terracotta-dark), opacity 0.028

  Использование: body { background-image: url('/bg-light.svg'); }
  Формы позиционированы по краям, центр оставлен чистым —
  там стоит контент. Вставлено как отдельный слой, поэтому
  не конфликтует с --dash-pattern (паттерн из еды остаётся поверх).

  Размер 1440x900, растягивается через background-size: cover.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <!-- Мягкое размытие: форма должна «плыть», а не иметь чёткий край. -->
    <filter id="blurL" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="1440" height="900" fill="#F5F1EA"/>

  <g filter="url(#blurL)">
    <!-- Терракотовое пятно сверху-слева -->
    <ellipse cx="150" cy="90" rx="330" ry="250" fill="#B4552D" opacity="0.045"/>

    <!-- Оливковое пятно справа сверху -->
    <ellipse cx="1330" cy="150" rx="300" ry="270" fill="#5C6B3F" opacity="0.05"/>

    <!-- Тёплое пятно снизу-слева -->
    <ellipse cx="230" cy="830" rx="360" ry="230" fill="#8C3F1F" opacity="0.028"/>

    <!-- Оливковое снизу-справа -->
    <ellipse cx="1290" cy="800" rx="290" ry="220" fill="#5C6B3F" opacity="0.035"/>
  </g>
</svg>
