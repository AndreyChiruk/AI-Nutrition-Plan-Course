<?xml version="1.0" encoding="UTF-8"?>
<!--
  Логотип «Планировщик питания».

  Концепция: тарелка (круг) с галочкой внутри.
  Круг — питание, галочка — выполненный план. Две простые формы
  читаются в 16×16 (favicon) и не теряют смысл в монохроме.

  Цвета берутся из палитры проекта:
    основной — терракота #C77A50.

  Варианты:
    logo.svg      — полный знак с подписью (горизонтальный);
    logo-icon.svg — только знак, для шапки и favicon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Планировщик питания">
  <circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="5"/>
  <path d="M21 33.5 L28.5 41 L44 24.5"
        fill="none" stroke="currentColor" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
