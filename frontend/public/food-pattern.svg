<?xml version="1.0" encoding="UTF-8"?>
<!--
  Бесшовный паттерн из еды для фона главной страницы.

  Рисунок построен по образцу: тонкие контурные иконки (яйцо,
  круассан, бургер, пицца, рыба, суши, чашка чая) на светлом фоне.
  Все элементы одного размера и нарисованы линией одинаковой
  толщины — так паттерн выглядит как одна иллюстрация, а не как
  набор разных картинок.

  Файл вставляется через CSS-свойство background-image и
  раскрашивается снаружи: цвет линий задаётся currentColor внутри
  data-URI-версии, поэтому отдельного файла для тёмной темы не нужно.
  Здесь хранится эталон, а в CSS используется его кодированная копия.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300">
  <g fill="none" stroke="#B4552D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.22">
    <!-- яйцо-глазунья -->
    <g transform="translate(30 40)">
      <path d="M0 18c0-11 9-18 21-18s21 7 21 18-9 18-21 18S0 29 0 18Z"/>
      <circle cx="21" cy="18" r="7.5"/>
    </g>
    <!-- круассан -->
    <g transform="translate(140 30)">
      <path d="M2 22C2 10 14 2 26 2s24 8 24 20"/>
      <path d="M2 22h48"/>
      <path d="M14 22V9M26 22V2M38 22V9"/>
    </g>
    <!-- бургер -->
    <g transform="translate(250 34)">
      <path d="M0 16C0 7 10 0 22 0s22 7 22 16"/>
      <path d="M0 16h44"/>
      <path d="M2 24h40M0 32c0 3 3 5 6 5h32c3 0 6-2 6-5"/>
    </g>
    <!-- пицца -->
    <g transform="translate(360 40)">
      <path d="M0 34 30 0l30 34Z"/>
      <circle cx="22" cy="24" r="3.5"/>
      <circle cx="38" cy="24" r="3.5"/>
      <circle cx="30" cy="12" r="3.5"/>
    </g>

    <!-- рыба -->
    <g transform="translate(40 140)">
      <path d="M0 18c10-12 30-16 48-16s38 4 48 16c-10 12-30 16-48 16S10 30 0 18Z"/>
      <circle cx="76" cy="15" r="2.6"/>
      <path d="M0 18 12 8M0 18l12 10"/>
    </g>
    <!-- суши -->
    <g transform="translate(165 132)">
      <rect x="0" y="0" width="34" height="30" rx="6"/>
      <path d="M0 12h34"/>
      <circle cx="17" cy="21" r="4"/>
    </g>
    <!-- чашка чая -->
    <g transform="translate(270 130)">
      <path d="M0 6h34v14a12 12 0 0 1-12 12H12A12 12 0 0 1 0 20Z"/>
      <path d="M34 11h7a6 6 0 0 1 0 12h-7"/>
      <path d="M9 -2c0-4 4-4 4-8M20 -2c0-4 4-4 4-8"/>
    </g>
    <!-- тако -->
    <g transform="translate(378 132)">
      <path d="M0 26C0 12 10 0 22 0s22 12 22 26Z"/>
      <path d="M6 18c5-5 11-7 16-7s11 2 16 7"/>
      <path d="M12 10v8M22 4v10M32 10v8"/>
    </g>

    <!-- кусок торта -->
    <g transform="translate(35 232)">
      <path d="M0 26 24 6l24 20v8H0Z"/>
      <path d="M0 26h48"/>
      <circle cx="24" cy="14" r="3"/>
    </g>
    <!-- мороженое -->
    <g transform="translate(155 226)">
      <path d="M8 16h24l-12 22Z"/>
      <circle cx="20" cy="10" r="10"/>
      <path d="M10 10h20"/>
    </g>
    <!-- банан -->
    <g transform="translate(268 228)">
      <path d="M2 4c0 16 12 28 28 28 6 0 10-3 10-7 0-3-3-5-7-4C20 24 12 16 12 4c0-3-2-4-5-4S2 1 2 4Z"/>
    </g>
    <!-- пончик -->
    <g transform="translate(380 228)">
      <circle cx="18" cy="18" r="17"/>
      <circle cx="18" cy="18" r="6"/>
      <path d="M8 8l2 3M26 6l-2 3M30 20l-3 1M6 22l3 1"/>
    </g>
  </g>
</svg>
